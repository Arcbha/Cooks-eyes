<style>
  /* SF Pro (Apple), shipped with the site so Android and Windows show it too. */
  @font-face { font-family: "SF Pro"; src: url("../fonts/sf-pro.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
  /* Apple-style design tokens. Light by default; dark follows the phone's setting. */
  :root {
    color-scheme: light dark;

    /* Palette (Apple's dark system colours). Every colour on the page comes from here.
       Ink #000000  Graphite #1C1C1E  Slate #2C2C2E  Snow #F5F5F7  Ash #98989D

    --ink-black: #000000;
    --graphite: #1C1C1E;
    --slate: #2C2C2E;
    --snow: #F5F5F7;
    --ash: #98989D;

    --sky: #0A84FF;
    --sun: #FFD60A;
    --leaf: #30D158;
    --indigo: #5E5CE6;
    --ember: #FF9592;       /* Ember, for text */
    --ember-fill: #E5484D;  /* Ember, for filled buttons (white text on it) */

    /* Roles */
    --bg: var(--ink-black);
    --card: var(--graphite);
    --raised: var(--slate);
    --ink: var(--snow);
    --muted: var(--ash);
    --line: rgba(84, 84, 88, 0.65);

    --chrome: rgba(22, 22, 24, 0.72);

    --line-strong: rgba(235, 235, 245, 0.45);
    --on-accent: #21201C;   /* text on Gold fills, both modes */
    --accent: var(--sky);
    --accent-soft: rgba(10, 132, 255, 0.2);

    --radius: 20px;
    --fs-title: 2.125rem;
    --fs-heading: 1.375rem;

    --fs-small: 0.9375rem;
    --fs-label: 0.8125rem;
  }

  /* Light mode: the same palette in Apple's light (higher-contrast) values.

  @media (prefers-color-scheme: light) {
    :root {
      --graphite: #FFFFFF;

  .alerts h2 { margin: 0; font-size: var(--fs-body); font-weight: 700; }
  .alerts p { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.35; }
  .alerts-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .pill { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--fill); color: var(--sky);
          font: inherit; font-size: var(--fs-small); font-weight: 700; cursor: pointer; }
  .pill.solid { background: var(--sky); color: #FFFFFF; }

  /* ============ Apple-style layer ============ */

  .open { background: var(--card); padding: 16px 16px 12px; }

  /* Each app takes one palette colour: its icon, its summary chips and its links */

  .app.saffron { --tint: rgba(224, 163, 70, 0.18); --solid: var(--gold-fill); --solid-bg: var(--marigold); --ink-2: var(--saffron); }
  .app.saffron .icon { color: var(--on-accent); }

  .app.indigo  { --tint: rgba(94, 92, 230, 0.20);  --solid: var(--indigo);  --ink-2: var(--indigo); }
  .icon {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 60%), var(--solid-bg, var(--solid));
    color: #FFFFFF;
  }
  .name { color: var(--ink); letter-spacing: -0.01em; }
  .icon svg { display: block; }
  .chev { display: flex; }
  .chev { color: var(--muted); opacity: 0.7; }
  .summary { padding: 4px 16px 16px; border-top: 0; }

  .stat { background: var(--tint); }
  .actions { padding: 0 12px 14px; gap: 8px; }
  .action { border: 0; border-radius: 12px; background: var(--fill); color: var(--accent); font-weight: 600; min-height: 44px; }
  .soon { border: 1.5px dashed var(--line); }
  .open, .action { transition: transform 100ms ease-out, background-color 150ms ease; }
  .open:active { transform: scale(0.985); filter: none; background: var(--fill); }
  .action:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .open, .action { transition: none; }

  }

  }

  /* Small labels in sentence case, not tracked-out capitals */
  .eyebrow, .summary .label, .done-toggle {
    text-transform: none; letter-spacing: 0; font-size: var(--fs-small); font-weight: 600;
  }
  /* The cat (drawn from the owner's ginger-and-white cat, yellow collar, Poke Ball bell).
     A small script picks what it does next at random, from about 25 things a cat does;
     only transforms and opacity move, so it costs almost nothing. */
  html { scrollbar-gutter: stable; }   /* the page does not shift when a scrollbar appears */
  .brand { display: flex; align-items: center; gap: 10px; }
  /* Same header on every page: a 32px top line, then the title row. The cat's strip is
     pinned to the same spot of the screen on every page (not after the title), so it
     neither moves nor changes size when switching pages. */
  header { padding-top: 14px; }
  header .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; min-height: 32px; }
  header .dateline { color: var(--muted); font-size: var(--fs-small); font-weight: 600; }
  header .brand { height: 56px; }
  header .brand h1 { margin: 0; }
  .cat-lane { position: absolute; top: 46px; left: max(230px, calc(50% - 130px)); right: max(16px, calc(50% - 360px));
              height: 56px; overflow: hidden; contain: layout paint; view-transition-name: home-suite-cat; }
  @view-transition { navigation: auto; }
  ::view-transition-group(home-suite-cat) { animation-duration: .35s; }
  /* one cat, not two fading into each other */
  ::view-transition-old(home-suite-cat) { animation: none; opacity: 0; }
  ::view-transition-new(home-suite-cat) { animation: none; opacity: 1; }
  .kitty { position: absolute; left: 0; bottom: 0; width: 60px; height: 56px; overflow: visible;
           transition-property: transform; transition-timing-function: linear; will-change: transform;
           color: var(--muted); --kitty-line: rgba(60, 40, 20, 0.16); }
  .kitty * { transform-box: view-box; }
  .kitty .k-w { stroke: var(--kitty-line); stroke-width: .5; }
  .kitty .k-all { transform-origin: 32px 28px; transition: transform .22s; }
  .kitty.flip .k-all { transform: scaleX(-1); }
  .kitty .k-say, .kitty .k-zzz { transform-box: fill-box; transform-origin: center; }
  .kitty.flip .k-say, .kitty.flip .k-zzz { transform: scaleX(-1); }

  /* poses */
  .kitty .k-pose { opacity: 0; transition: opacity .25s; }

  .kitty .k-sleep .k-ears { transform-origin: 46px 39px; }
  .kitty .k-torso { transform-origin: 23px 42px; }

  .kitty .k-shut, .kitty .k-tongue, .kitty .k-purr, .kitty .k-say, .kitty .k-zzz, .kitty .k-scratch { opacity: 0; transition: opacity .3s; }
  .kitty .k-lhead .k-open { opacity: 0; }

  /* eyes closed */
  .kitty.a-blink .k-open, .kitty.a-lick .k-open, .kitty.a-wash .k-open, .kitty.a-purr .k-open,

  .kitty.a-dream .k-ltail { animation: k-flick .9s ease-in-out infinite; }
  .kitty.a-purrlie .k-lhead { transform: translateY(-1px); }

  @keyframes k-blink  { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes k-step   { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }

  @keyframes k-bob    { to { transform: translateY(-0.8px); } }

  @keyframes k-sway   { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  @keyframes k-swish  { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  @keyframes k-flick  { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-12deg); } 90% { transform: rotate(6deg); } }
  @keyframes k-twitch { 0%, 88%, 100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } 96% { transform: rotate(4deg); } }
  @keyframes k-lick   { from { transform: scaleY(.4); } to { transform: scaleY(1); } }
  @keyframes k-wash   { from { transform: rotate(-150deg); } to { transform: rotate(-128deg); } }
  @keyframes k-scratch { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  @keyframes k-yawn   { 0% { transform: scale(0); } 35%, 70% { transform: scale(1, 1.5); } 100% { transform: scale(0); } }
  @keyframes k-meow   { 0%, 100% { transform: scale(0); } 40% { transform: scale(1, 1.2); } }
  @keyframes k-say    { 0% { opacity: 0; transform: translateY(3px); } 25%, 70% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-3px); } }
  @keyframes k-knead  { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
  @keyframes k-purr   { from { transform: translateX(-0.35px); } to { transform: translateX(0.35px); } }
  @keyframes k-fade   { from { opacity: .25; } to { opacity: 1; } }
  @keyframes k-sniff  { from { transform: rotate(28deg); } to { transform: rotate(23deg); } }
  @keyframes k-wiggle { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  @keyframes k-pounce { 0% { transform: translateY(0); } 45% { transform: translateY(-13px); } 100% { transform: translateY(0); } }
  @keyframes k-hop    { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } }
  @keyframes k-paddle { from { transform: translateX(0); } to { transform: translateX(1.6px); } }
  @keyframes k-breathe { 50% { transform: scale(1.04, 1.09); } }
  @keyframes k-float  { from { transform: translate(0, 4px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(5px, -6px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .kitty, .kitty * { animation: none !important; transition: none !important; }
    @view-transition { navigation: none; }
  }
</style>

    if (!m) return;
    try { localStorage.setItem("home-suite-device-key-v1", m[1]); } catch (e) { /* storage blocked */ }
    history.replaceState(null, "", location.pathname + location.search);

  try { localStorage.removeItem("recipe-page-passcode-v1"); } catch (e) { /* old passcode, no longer used */ }

        link.className = "action";
        link.href = a.href;
        link.textContent = a.label;
        actions.appendChild(link);
      });
      li.appendChild(actions);
    }
    appsEl.appendChild(li);
  });

  var soon = document.createElement("li");
  soon.className = "soon";
  soon.textContent = "More home apps will appear here.";
  appsEl.appendChild(soon);

  function fill(id, label, build) {
    var box = summaries[id];
    if (!box) return;
    box.textContent = "";
    var l = document.createElement("span");
    l.className = "label";
    l.textContent = label;
    box.appendChild(l);
    build(box);
    box.hidden = false;
  }

  /* ---------- live summaries ---------- */

  // To-dos: open items per list (last saved copy first, then fresh from Google).
  function showTodos(items) {
    var counts = {}, order = [];
    (items || []).forEach(function (it) {
      if (it.done) return;
      if (!counts[it.list]) { counts[it.list] = 0; order.push(it.list); }
      counts[it.list]++;
    });
    fill("todos", "Open", function (box) {
      if (!order.length) {
        var q = document.createElement("span");
        q.className = "quiet";
        q.textContent = "Nothing open. All done!";
        box.appendChild(q);
        return;
      }
      var stats = document.createElement("div");
      stats.className = "stats";
      order.forEach(function (list) {
        var s = document.createElement("span");
        s.className = "stat";
        var b = document.createElement("b");
        b.textContent = counts[list];
        s.appendChild(b);
        s.appendChild(document.createTextNode(list));
        stats.appendChild(s);
      });
      box.appendChild(stats);
    });
  }
  try { var cached = JSON.parse(store(TODO_CACHE_KEY) || "null"); if (cached) showTodos(cached); } catch (e) { /* ignore */ }
  var device = document.getElementById("device");
  function deviceNote(text, ok) {
    device.textContent = text;
    device.className = "device" + (ok ? " ok" : "");
    device.hidden = false;
  }
  /* Phone alerts: the background helper (../sw.js) needs this device's key to ask what is new. */
  var SW_CONFIG = new URL("../home-suite-config", location.href).href;
  function alertConfig(extra) {
    if (!("caches" in window)) return Promise.resolve();
    return caches.open("home-suite").then(function (c) {
      return c.match(SW_CONFIG).then(function (res) { return res ? res.json() : {}; }).then(function (cfg) {
        cfg.helper = CONFIG.HELPER_URL;
        cfg.key = store(DEVICE_KEY) || "";
        Object.keys(extra || {}).forEach(function (k) { cfg[k] = extra[k]; });
        return c.put(SW_CONFIG, new Response(JSON.stringify(cfg), { headers: { "Content-Type": "application/json" } }));
      });
    }).catch(function () { /* storage blocked: alerts show a general message */ });
  }

  if (store(DEVICE_KEY)) {
    if (window.__justSetUp) deviceNote("This device is set up. Home To-dos and the recipe tools will work here.", true);
    fetch(CONFIG.HELPER_URL, { method: "POST", body: JSON.stringify({ key: store(DEVICE_KEY), action: "todos" }) })
      .then(function (res) { return res.json(); })
      .then(function (out) {
        if (out && out.ok) { showTodos(out.items); setUpAlerts(out.push && out.push.key); }
        else if (out && out.needsSetup) {
          try { localStorage.removeItem(DEVICE_KEY); } catch (e) { /* ignore */ }
          deviceNote("This device's setup link is no longer valid. Open your current setup link once.");
        }
      })
      .catch(function () { /* the cached numbers stay */ });
  } else {
    deviceNote("This device isn't set up yet. Open your Home Suite setup link on it once.");
  }

  /* ---------- to-do alerts on this device (shown as "Home Suite", not another app) ---------- */

  var PUSH_ENDPOINT_KEY = "home-suite-push-endpoint";
  var al = {
    box: document.getElementById("alerts"), msg: document.getElementById("alertsMsg"),
    on: document.getElementById("alertsOn"), off: document.getElementById("alertsOff"),
    test: document.getElementById("alertsTest"), install: document.getElementById("installApp")
  };
  var installPrompt = null;
  var iPhone = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var installed = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installPrompt = e;
    al.install.hidden = al.box.hidden;
  });
  al.install.addEventListener("click", function () {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(function () { installPrompt = null; al.install.hidden = true; });
  });

  function alertsShow(text, buttons) {
    al.box.hidden = false;
    al.msg.textContent = text;
    ["on", "off", "test"].forEach(function (b) { al[b].hidden = (buttons || []).indexOf(b) < 0; });
    al.install.hidden = !installPrompt;
  }

  function helperPost(body) {
    body.key = store(DEVICE_KEY) || "";
    return fetch(CONFIG.HELPER_URL, { method: "POST", body: JSON.stringify(body) }).then(function (res) { return res.json(); });
  }

  function keyBytes(b64) {
    var s = atob((b64 + "===".slice((b64.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  var pushKey = "";
  function setUpAlerts(key) {
    pushKey = key || "";
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      if (iPhone && !installed) {
        alertsShow("On iPhone: tap Share, then Add to Home Screen. Open Home Suite from your home screen and turn alerts on there.");
      } else alertsShow("This browser can't show alerts. Try Chrome on Android, or Safari on iPhone after adding Home Suite to the home screen.");
      return;
    }
    if (!pushKey) { alertsShow("Alerts are not ready on the helper yet."); return; }
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).then(function (reg) {
      alertConfig();
      return reg.pushManager.getSubscription();
    }).then(function (sub) {
      if (sub) {
        store(PUSH_ENDPOINT_KEY, sub.endpoint);
        alertsShow("On for this device. New to-dos show up as Home Suite alerts." +
                   (installed || iPhone ? "" : " Install the app so they carry the Home Suite name and icon."), ["test", "off"]);
      } else if (Notification.permission === "denied") {
        alertsShow("Alerts are blocked for this site. Allow notifications for it in the browser's settings, then reload.");
      } else {
        alertsShow("Get an alert on this device when a to-do is added, from Home Suite itself.", ["on"]);
      }
    }).catch(function () { alertsShow("Alerts could not start on this device."); });
  }

  al.on.addEventListener("click", function () {
    al.on.disabled = true;
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") throw new Error("denied");
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
    }).then(function (sub) {
      return helperPost({ action: "pushSubscribe", endpoint: sub.endpoint }).then(function (out) {
        if (!out || !out.ok) throw new Error((out && out.error) || "not saved");
        store(PUSH_ENDPOINT_KEY, sub.endpoint);
        return alertConfig({ since: Date.now() });
      });
    }).then(function () {
      setUpAlerts(pushKey);
    }).catch(function (err) {
      alertsShow(err && err.message === "denied"
        ? "Alerts were not allowed. To change that, allow notifications for this site in the browser's settings."
        : "Could not turn alerts on. Check the internet and try again.", ["on"]);
    }).then(function () { al.on.disabled = false; });
  });

  al.off.addEventListener("click", function () {
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return;
      helperPost({ action: "pushUnsubscribe", endpoint: sub.endpoint }).catch(function () {});
      return sub.unsubscribe();
    }).then(function () {
      try { localStorage.removeItem(PUSH_ENDPOINT_KEY); } catch (e) { /* ignore */ }
      setUpAlerts(pushKey);
    });
  });

  al.test.addEventListener("click", function () {
    al.test.disabled = true;
    al.test.textContent = "Sending...";
    helperPost({ action: "pushTest", endpoint: store(PUSH_ENDPOINT_KEY) || "" }).then(function (out) {
      al.test.textContent = out && out.ok ? "Test sent" : "Not sent";
    }).catch(function () { al.test.textContent = "Not sent"; })
      .then(function () { setTimeout(function () { al.test.textContent = "Send a test"; al.test.disabled = false; }, 2500); });
  });

  // Recipes: today's menu from the recipe sheet's Menu tab (read through the helper).
  if (CONFIG.HELPER_URL) {
    fetch(CONFIG.HELPER_URL + "?recipes=1&t=" + Date.now(), { cache: "no-store", credentials: "omit" })
      .then(function (res) { return res.ok ? res.json() : {}; })
      .then(function (out) { return out && out.ok ? out.menu : ""; })
      .then(function (text) {
        var rows = parseCSV(text);
        var head = (rows[0] || []).map(function (h) { return String(h).toLowerCase(); });
        var di = head.findIndex(function (h) { return /date|day/.test(h); });
        var ni = head.findIndex(function (h) { return /dish|name|item/.test(h); });
        var mi = head.findIndex(function (h) { return /meal|section|time/.test(h); });
        var today = dayKey(new Date());
        var meals = {}, order = [];
        if (di >= 0 && ni >= 0) {
          rows.slice(1).forEach(function (r) {
            if (planDate(r[di]) !== today || !String(r[ni] || "").trim()) return;
            var meal = mi >= 0 && String(r[mi] || "").trim() || "Menu";
            if (!meals[meal]) { meals[meal] = []; order.push(meal); }
            meals[meal].push(String(r[ni]).trim());
          });
        }
        fill("recipes", "Today's menu", function (box) {
          if (!order.length) {
            var q = document.createElement("span");
            q.className = "quiet";
            q.textContent = "Nothing planned for today yet.";
            box.appendChild(q);
            return;
          }
          order.forEach(function (meal) {
            var line = document.createElement("div");
            var b = document.createElement("b");
            b.textContent = meal + ": ";
            line.appendChild(b);
            line.appendChild(document.createTextNode(meals[meal].join(", ")));
            box.appendChild(line);
          });
        });
      })
      .catch(function () { /* no summary */ });
  }

  function planDate(raw) {
    var s = String(raw || "").trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    return m ? m[3] + "-" + pad2(m[2]) + "-" + pad2(m[1]) : "";
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    text = String(text || "").replace(/^﻿/, "");
    if (/^\s*<(!doctype|html)/i.test(text)) return [];
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
})();
</script>
<script>
(function () {
  "use strict";
    /* The cat's mind. Each thing it does lasts a random time, and what comes next is a
       weighted random pick, like a real cat: never the same loop twice. Opening another
       Home Suite page carries on where the last page left off (same spot, same action). */
    var dateLine = document.getElementById("dateLine");
    if (dateLine) dateLine.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

    (function catLife() {
      var lane = document.getElementById("catLane"), cat = document.getElementById("kitty");
      if (!lane || !cat) return;
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var MEMORY = "home-suite-cat-v1", SIZE = 60;
      var ACTS = {
        sit: ["sit", 2, 5], gaze: ["sit", 4, 9], blink: ["sit", 2.5, 4], lick: ["sit", 3, 6], wash: ["sit", 3, 5],
        scratch: ["sit", 1.8, 3.2], yawn: ["sit", 2.3, 2.3], meow: ["sit", 1.9, 1.9], swish: ["sit", 2, 4],
        knead: ["sit", 3, 6], purr: ["sit", 3, 6], lookback: ["sit", 1.5, 3],
        stand: ["stand", 1.2, 3], sniff: ["stand", 2, 4], stretch: ["stand", 2.4, 3.4], arch: ["stand", 1.4, 1.4],
        crouch: ["stand", 1.6, 3.2], hop: ["stand", .9, .9], turn: ["stand", .8, 1.6],
        walk: ["stand", 0, 0, 26], trot: ["stand", 0, 0, 55], zoomies: ["stand", 0, 0, 150], pounce: ["stand", 0, 0, 90],
        loaf: ["lie", 4, 9], sleep: ["lie", 8, 18], dream: ["lie", 3, 5], purrlie: ["lie", 3, 6]
      };
      var NEXT = {
        sit: { gaze: 3, blink: 2, lick: 3, wash: 2, scratch: 1.5, yawn: 1.5, meow: 1.2, swish: 2, knead: 1, purr: 1.5,
               lookback: 1.5, sit: 1, walk: 4, trot: 1.2, stand: 2, zoomies: .6, loaf: 2 },
        stand: { walk: 4, trot: 1.5, sniff: 3, stretch: 2, crouch: 1.8, hop: .8, arch: .5, sit: 4, stand: 1, turn: 1.2,
                 zoomies: .8, loaf: .8 },
        lie: { loaf: 2, sleep: 3, dream: 1, purrlie: 1.2, stretch: 1.6, sit: 2.4 }
      };
      var AFTER = {
        crouch: { pounce: 6, stand: 1 }, pounce: { sit: 2, stand: 2, crouch: 1, hop: 1, lick: 1 },
        zoomies: { sit: 3, loaf: 2, stand: 1, lick: 1 }, yawn: { loaf: 2, sleep: 1, sit: 1, gaze: 1, stretch: 1 },
        sleep: { dream: 1.5, sleep: 1, loaf: 2, stretch: 2, yawn: 1 }, dream: { sleep: 2, loaf: 1 },
        stretch: { walk: 3, sit: 2, stand: 1, trot: 1, yawn: 1 }, arch: { zoomies: 2, sit: 1, crouch: 1 }
      };
      var START = { sit: 2, gaze: 2, loaf: 2, sleep: 2, lick: 1.5, wash: 1, walk: 2, stand: 1, sniff: 1, purr: 1,
                    knead: 1, swish: 1, crouch: 1, stretch: 1 };
      var x = 0, facing = 1, act = "sit", endsAt = 0, goal = null, timer = 0;

      function room() { return Math.max(0, lane.clientWidth - SIZE); }
      function laneLeft() { return lane.getBoundingClientRect().left; }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function pick(weights, not) {
        var names = Object.keys(weights).filter(function (n) { return n !== not || n === "sleep" || n === "walk"; });
        if (room() < 30) names = names.filter(function (n) { return !ACTS[n][3]; });
        if (!names.length) return "sit";
        var total = names.reduce(function (s, n) { return s + weights[n]; }, 0), r = Math.random() * total;
        for (var i = 0; i < names.length; i++) { r -= weights[names[i]]; if (r <= 0) return names[i]; }
        return names[0];
      }
      function nowX() {
        var m = getComputedStyle(cat).transform.match(/matrix\(([^)]+)\)/);
        return m ? parseFloat(m[1].split(",")[4]) : x;
      }
      function show(name) {
        cat.setAttribute("class", "kitty p-" + ACTS[name][0] + " a-" + name + (facing < 0 ? " flip" : ""));
      }
      function place(px, secs, easing) {
        cat.style.transitionDuration = (secs || 0) + "s";
        cat.style.transitionTimingFunction = easing || "linear";
        x = Math.max(0, Math.min(room(), px));
        cat.style.transform = "translateX(" + x + "px)";
      }
      function remember() {
        try {
          localStorage.setItem(MEMORY, JSON.stringify({ act: act, x: laneLeft() + nowX(), facing: facing,
            left: Math.max(0, endsAt - Date.now()), goal: goal === null ? null : laneLeft() + goal, at: Date.now() }));
        } catch (e) { /* storage blocked: the cat just starts afresh */ }
      }
      function later(secs, fn) { clearTimeout(timer); endsAt = Date.now() + secs * 1000; timer = setTimeout(fn, secs * 1000); }

      function moveTo(target, speed, then) {
        target = Math.max(0, Math.min(room(), target));
        var dist = Math.abs(target - x);
        if (dist < 3) { goal = null; then(); return; }
        if ((target > x ? 1 : -1) !== facing) facing = -facing;
        show(act);
        goal = target;
        var secs = Math.max(.4, dist / speed);
        place(target, secs, act === "pounce" ? "cubic-bezier(.2,.7,.3,1)" : "linear");
        later(secs, function () { goal = null; then(); });
      }

      function run(name, secs) {
        act = name;
        var spec = ACTS[name];
        if (name === "lookback" || name === "turn") facing = -facing;
        show(name);
        if (spec[3]) {
          var r = room(), speed = spec[3];
          if (name === "zoomies") {
            var dashes = 2 + Math.floor(Math.random() * 4);
            (function dash() {
              if (!dashes--) { decide(); return; }
              var far = x < r / 2 ? rand(r * .7, r) : rand(0, r * .3);
              moveTo(far, speed, dash);
            })();
          } else if (name === "pounce") {
            var hop = rand(28, 50) * facing;
            if (x + hop < 0 || x + hop > r) hop = -hop;
            moveTo(x + hop, speed, decide);
          } else {
            var to = secs === undefined ? rand(0, r) : secs;   // a walk carried over from another page
            if (secs === undefined && Math.abs(to - x) < 30) to = x < r / 2 ? rand(Math.min(r, x + 30), r) : rand(0, Math.max(0, x - 30));
            moveTo(to, speed, decide);
          }
        } else {
          later(secs === undefined ? rand(spec[1], spec[2]) : secs, decide);
        }
        remember();
      }

      function decide() {
        var pose = ACTS[act][0];
        run(pick(AFTER[act] && Math.random() < .75 ? AFTER[act] : NEXT[pose], act));
      }

      // Pick up from the last page, or start somewhere random doing something random.
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(MEMORY) || "null"); } catch (e) { saved = null; }
      cat.style.transition = "none";
      if (saved && ACTS[saved.act] && Date.now() - saved.at < 20000) {
        facing = saved.facing === -1 ? -1 : 1;
        place(saved.x - laneLeft());
        void cat.getBoundingClientRect();
        cat.style.transition = "";
        // Moving on: wait one frame so the walk starts from the spot it was saved at.
        act = saved.act;
        if (saved.act === "walk" || saved.act === "trot") {
          show(saved.act);
          requestAnimationFrame(function () { run(saved.act, saved.goal === null ? undefined : saved.goal - laneLeft()); });
        } else if (ACTS[saved.act][3]) { show(saved.act); requestAnimationFrame(function () { run(saved.act); }); }
        else run(saved.act, Math.max(1, (saved.left || 0) / 1000));
      } else {
        facing = Math.random() < .5 ? 1 : -1;
        place(rand(0, room()));
        void cat.getBoundingClientRect();
        cat.style.transition = "";
        run(pick(START));
      }
      // The page can still shift a little while it finishes loading; keep the cat on its spot.
      var placedAt = laneLeft();
      function settle() {
        var d = laneLeft() - placedAt;
        placedAt = laneLeft();
        if (Math.abs(d) < .5 || goal !== null) return;
        cat.style.transition = "none";
        place(x - d);
        void cat.getBoundingClientRect();
        cat.style.transition = "";
      }
      window.addEventListener("load", settle);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
      window.addEventListener("pagehide", remember);
      window.addEventListener("resize", function () { if (x > room()) place(room()); });
    })();
})();
</script>
</body>
</html>
