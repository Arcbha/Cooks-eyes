<script>

  HELPER_URL: "https://script.google.com/macros/s/AKfycbzKgqTVNnPieihSyylKKASbCG3afc_VKvxpC01BBxL57A8YLPGeYSRl2l5z2PExViO5/exec",

<style>
  /* Apple-style design tokens. Light by default; dark follows the phone's setting. */
  :root {
    color-scheme: light dark;

    /* Palette (Apple's dark system colours). Every colour on the page comes from here.
       Ink #000000  Graphite #1C1C1E  Slate #2C2C2E  Snow #F5F5F7  Ash #98989D
       Sky #0A84FF  Sun #FFD60A  Leaf #30D158  Indigo #5E5CE6 (Apple system colours)
       Gold #FFC53D / text #FFCA16, Ember #E5484D / text #FF9592 (Radix Colors amber & red) */
    --ink-black: #000000;
    --graphite: #1C1C1E;
    --slate: #2C2C2E;
    --snow: #F5F5F7;
    --ash: #98989D;
    --saffron: #FFCA16;     /* Gold, for text and icons */
    --gold-fill: #FFC53D;   /* Gold, for filled buttons (dark text on it) */
    --sky: #0A84FF;
    --sun: #FFD60A;
    --leaf: #30D158;
    --indigo: #5E5CE6;
    --ember: #FF9592;       /* Ember, for text */
    --ember-fill: #E5484D;  /* Ember, for filled buttons (white text on it) */

    /* Roles */
    --bg: var(--ink-black);
    --card: var(--graphite);
    --raised: var(--slate);
    --ink: var(--snow);
    --muted: var(--ash);
    --line: rgba(84, 84, 88, 0.65);
    --fill: rgba(118, 118, 128, 0.24);
    --chrome: rgba(22, 22, 24, 0.72);
    --shadow: none;
    --line-strong: rgba(235, 235, 245, 0.45);
    --on-accent: #21201C;   /* text on Gold fills, both modes */
    --accent: var(--sky);
    --accent-soft: rgba(10, 132, 255, 0.2);

    --radius: 20px;
    --fs-title: 2.125rem;
    --fs-heading: 1.375rem;
    --fs-body: 1.0625rem;
    --fs-small: 0.9375rem;
    --fs-label: 0.8125rem;
  }

  /* Light mode: the same palette in Apple's light (higher-contrast) values.
     The page follows the phone: light when it is light, dark when it is dark. */
  @media (prefers-color-scheme: light) {
    :root {
      --graphite: #FFFFFF;
      --slate: #FFFFFF;
      --snow: #1C1C1E;
      --ash: #6E6E73;
      --saffron: #AB6400;
      --sky: #007AFF;
      --sun: #B25000;
      --leaf: #248A3D;
      --indigo: #3634A3;
      --ember: #CE2C31;

      --bg: #F2F2F7;
      --line: rgba(60, 60, 67, 0.16);
      --line-strong: rgba(60, 60, 67, 0.5);
      --fill: rgba(118, 118, 128, 0.12);
      --chrome: rgba(242, 242, 247, 0.78);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.06);
      --on-accent: #21201C;
      --accent-soft: rgba(0, 122, 255, 0.12);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
                 "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif;
    line-height: 1.35; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
  [hidden] { display: none !important; }

  header { padding: 22px 0 18px; }
  .eyebrow {
    display: block; font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  h1 { margin: 4px 0 0; font-size: var(--fs-title); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }

  .apps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 700px) { .apps { grid-template-columns: 1fr 1fr; } }

  .app {
    --tint: var(--fill); --chip: var(--fill); --solid: var(--raised); --ink-2: var(--ink);
    position: relative; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }

  .open {
    display: flex; align-items: center; gap: 14px; padding: 16px; text-decoration: none; color: inherit;
    background: var(--tint);
  }
  .open:active { filter: brightness(0.97); }
  .icon {
    flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: var(--chip); font-size: 1.8rem; line-height: 1;
  }
  .name { margin: 0; font-size: var(--fs-heading); font-weight: 800; color: var(--ink-2); line-height: 1.2; }
  .blurb { margin-top: 2px; font-size: var(--fs-small); color: var(--muted); }
  .chev { margin-left: auto; font-size: 1.6rem; color: var(--ink-2); opacity: 0.6; }

  .summary { padding: 14px 16px 16px; font-size: var(--fs-body); }
  .summary .label { display: block; margin-bottom: 4px; font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: var(--tint); color: var(--ink-2); font-size: var(--fs-small); font-weight: 700;
  }
  .stat b { font-size: var(--fs-body); }
  .quiet { color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px; }
  .action {
    flex: 1 1 0; min-width: 96px; display: flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 12px;
    color: var(--ink); font-size: var(--fs-small); font-weight: 700; text-decoration: none; background: var(--card);
  }
  .action:active { background: var(--tint); }

  .soon {
    display: flex; align-items: center; justify-content: center; min-height: 96px; padding: 16px;
    border: 2px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: var(--fs-small); text-align: center;
  }
  .device { margin: 18px 4px 0; color: var(--muted); font-size: var(--fs-small); text-align: center; }
  .device.ok { color: var(--leaf); }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* ============ Apple-style layer ============ */
  h1 { letter-spacing: -0.022em; }
  .eyebrow { font-weight: 600; letter-spacing: 0.04em; }
  .app { border: 0; box-shadow: var(--shadow); }
  .open { background: var(--card); padding: 16px 16px 12px; }
  /* App icons: a coloured squircle, like the home screen */
  .icon { width: 58px; height: 58px; border-radius: 14px; font-size: 1.9rem;
          box-shadow: inset 0 0 0 0.5px rgba(245, 245, 247, 0.12); }
  /* Each app takes one palette colour: its icon, its summary chips and its links */
  .app.sky     { --tint: rgba(10, 132, 255, 0.16); --solid: var(--sky);     --ink-2: var(--sky); }
  .app.saffron { --tint: rgba(255, 197, 61, 0.18); --solid: var(--gold-fill); --ink-2: var(--saffron); }
  .app.saffron .icon { color: var(--on-accent); }
  .app.leaf    { --tint: rgba(48, 209, 88, 0.16);  --solid: var(--leaf);    --ink-2: var(--leaf); }
  .app.indigo  { --tint: rgba(94, 92, 230, 0.20);  --solid: var(--indigo);  --ink-2: var(--indigo); }
  .icon {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 60%), var(--solid);
    color: #FFFFFF;
  }
  .name { color: var(--ink); letter-spacing: -0.01em; }
  .icon svg { display: block; }
  .chev { display: flex; }
  .chev { color: var(--muted); opacity: 0.7; }
  .summary { padding: 4px 16px 16px; border-top: 0; }
  .summary .label { font-weight: 600; letter-spacing: 0.04em; }
  .stat { background: var(--tint); }
  .actions { padding: 0 12px 14px; gap: 8px; }
  .action { border: 0; border-radius: 12px; background: var(--fill); color: var(--accent); font-weight: 600; min-height: 44px; }
  .soon { border: 1.5px dashed var(--line); }
  .open, .action { transition: transform 100ms ease-out, background-color 150ms ease; }
  .open:active { transform: scale(0.985); filter: none; background: var(--fill); }
  .action:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .open, .action { transition: none; }
    .open:active, .action:active { transform: none; }
  }
  @media (prefers-contrast: more) {
    .app { box-shadow: none; outline: 1px solid var(--line-strong); }
  }

  /* Small labels in sentence case, not tracked-out capitals */
  .eyebrow, .summary .label, .done-toggle {
    text-transform: none; letter-spacing: 0; font-size: var(--fs-small); font-weight: 600;
  }
  /* The cat: walks along the title row, licks a paw, purrs, walks back and naps.
     Only transforms and opacity move, so it costs almost nothing. */
  .brand { display: flex; align-items: center; gap: 10px; }
  .cat-lane { position: relative; flex: 1 1 auto; min-width: 64px; max-width: 420px; height: 50px; overflow: hidden; contain: layout paint; }
  .kitty { position: absolute; left: 0; bottom: 0; width: 64px; height: 50px; overflow: visible;
           transition: transform 4s linear; will-change: transform; color: var(--muted); }
  .kitty * { transform-box: view-box; }
  .kitty .k-all  { transform-origin: 32px 22px; transition: transform .25s; }
  .kitty.flip .k-all { transform: scaleX(-1); }
  .kitty .k-zzz { transform-box: fill-box; transform-origin: center; }
  .kitty.flip .k-zzz { transform: scaleX(-1); }
  .kitty .k-fit  { transition: transform .5s ease; }
  .kitty .k-body { transform-origin: 30px 30px; }
  .kitty .k-head { transform-origin: 43px 21px; transition: transform .5s ease; }
  .kitty .k-tail { transform-origin: 16px 22px; animation: k-sway 3s ease-in-out infinite alternate; }
  .kitty .k-leg  { transition: transform .4s ease; }
  .kitty .k-leg.fb { transform-origin: 21.2px 27px; } .kitty .k-leg.nb { transform-origin: 23.7px 27px; }
  .kitty .k-leg.ff { transform-origin: 41.2px 27px; } .kitty .k-leg.nf { transform-origin: 43.7px 27px; }
  .kitty .k-shut, .kitty .k-tongue, .kitty .k-zzz, .kitty .k-purr { opacity: 0; transition: opacity .4s; }
  .kitty .k-tongue { transform-origin: 56px 21px; }

  .kitty.walk .k-leg.nf, .kitty.walk .k-leg.fb { animation: k-step .5s ease-in-out infinite alternate; }
  .kitty.walk .k-leg.ff, .kitty.walk .k-leg.nb { animation: k-step .5s ease-in-out infinite alternate-reverse; }
  .kitty.walk .k-body { animation: k-bob .25s ease-in-out infinite alternate; }

  .kitty.lick .k-head { transform: rotate(14deg); }
  .kitty.lick .k-leg.nf { transform: rotate(-100deg); }
  .kitty.lick .k-tongue { opacity: 1; animation: k-lick .45s ease-in-out infinite alternate; }
  .kitty.lick .k-open, .kitty.purr .k-open, .kitty.sleep .k-open { opacity: 0; }
  .kitty.lick .k-shut, .kitty.purr .k-shut, .kitty.sleep .k-shut { opacity: 1; }

  .kitty.purr .k-body { animation: k-purr .09s linear infinite alternate; }
  .kitty.purr .k-purr { opacity: 1; animation: k-fade .8s ease-in-out infinite alternate; }

  .kitty.sleep .k-fit { transform: translateY(8px); }
  .kitty.sleep .k-leg { transform: scaleY(.2); }
  .kitty.sleep .k-head { transform: rotate(16deg) translateY(1px); }
  .kitty.sleep .k-tail { animation: none; transform: rotate(-70deg); }
  .kitty.sleep .k-body { animation: k-breathe 2.4s ease-in-out infinite; }
  .kitty.sleep .k-zzz { opacity: 1; }
  .kitty.sleep .k-zzz text { animation: k-float 2.4s ease-out infinite; }
  .kitty.sleep .k-zzz text + text { animation-delay: 1.2s; }

  @keyframes k-step  { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
  @keyframes k-bob   { to { transform: translateY(-0.8px); } }
  @keyframes k-sway  { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  @keyframes k-lick  { from { transform: scaleY(.4); } to { transform: scaleY(1); } }
  @keyframes k-purr  { from { transform: translateX(-0.35px); } to { transform: translateX(0.35px); } }
  @keyframes k-fade  { from { opacity: .25; } to { opacity: 1; } }
  @keyframes k-breathe { 50% { transform: scale(1.05, 1.08); } }
  @keyframes k-float { from { transform: translate(0, 4px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(5px, -6px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .kitty, .kitty * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="greeting"></span>
    <div class="brand">
      <h1 id="title">Home Suite</h1>
      <div class="cat-lane" id="catLane" aria-hidden="true">
        <svg class="kitty" id="kitty" viewBox="0 -6 64 50" focusable="false">
          <g class="k-all"><g class="k-fit">
            <g fill="#FFC53D">
              <path class="k-tail" d="M17 22 C9 21 5 12 9 5" fill="none" stroke="#FFC53D" stroke-width="4" stroke-linecap="round"/>
              <rect class="k-leg fb" x="19" y="26" width="4.4" height="12" rx="2.2" opacity=".7"/>
              <rect class="k-leg ff" x="39" y="26" width="4.4" height="12" rx="2.2" opacity=".7"/>
              <ellipse class="k-body" cx="30" cy="24" rx="15" ry="8.5"/>
              <rect class="k-leg nb" x="21.5" y="26" width="4.4" height="12" rx="2.2"/>
              <rect class="k-leg nf" x="41.5" y="26" width="4.4" height="12" rx="2.2"/>
            </g>
            <g class="k-head">
              <g fill="#FFC53D">
                <circle cx="48" cy="15" r="8"/>
                <path d="M41.5 11 L42.5 2 L48 8 Z"/>
                <path d="M49 7.5 L54.5 2 L55.5 11.5 Z"/>
                <ellipse cx="54.5" cy="18" rx="4" ry="3.2"/>
              </g>
              <ellipse class="k-tongue" cx="56.5" cy="22.5" rx="1.5" ry="2.2" fill="#FF9592"/>
              <circle cx="58.2" cy="16.6" r="1.1" fill="#E5484D"/>
              <ellipse class="k-open" cx="51" cy="13.5" rx="1.3" ry="1.8" fill="#21201C"/>
              <path class="k-shut" d="M49.4 13.8 Q51 15.4 52.6 13.8" fill="none" stroke="#21201C" stroke-width="1.1" stroke-linecap="round"/>
              <path d="M41.5 19.5 Q46 24 51.5 21" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="47" cy="23" r="1.7" fill="#FFCA16"/>

  <ul class="apps" id="apps"></ul>

<script>
(function () {
  "use strict";
  /* Setup link: this page's address + "#setup=<key>". Opening it once saves this device's key,
     so the Home Suite pages can read and save; the key is never typed. */
  (function takeSetupLink() {
    var m = location.hash.match(/^#setup=([\w-]{20,})$/);
    if (!m) return;
    try { localStorage.setItem("home-suite-device-key-v1", m[1]); } catch (e) { /* storage blocked */ }
    history.replaceState(null, "", location.pathname + location.search);
    window.__justSetUp = true;
  })();
  try { localStorage.removeItem("recipe-page-passcode-v1"); } catch (e) { /* old passcode, no longer used */ }

  /* Line icons in the SF Symbols style: one stroke weight, drawn in the text colour.
     Only these fixed shapes are ever inserted as markup. */
  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
    bowl: '<path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8c0-1.2 1-1.6 1-2.8M12 8c0-1.2 1-1.6 1-2.8M15.5 8c0-1.2 1-1.6 1-2.8"/>',
    moon: '<path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6z"/>',
    fork: '<path d="M7 3v7.5M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10.5V21M17.5 21V3c-2 1-3.5 3.6-3.5 6.5 0 2.2 1.2 3.5 3.5 3.5"/>',
    speaker: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11"/>',
    loading: '<path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
    cart: '<path d="M3 4h2.2l2.3 10.5h10.3L20.5 7.5H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
    sparkles: '<path d="M11 3.5l1.6 4.4 4.4 1.6-4.4 1.6L11 15.5l-1.6-4.4L5 9.5l4.4-1.6zM18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
    note: '<path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/>',
    list: '<path d="M10 6.5h10M10 12h10M10 17.5h10M4 6.5l1.2 1.2L7.5 5.4M4 12l1.2 1.2L7.5 10.9M4 17.5l1.2 1.2 2.3-2.3"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    xmark: '<path d="M7 7l10 10M17 7L7 17"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chevron: '<path d="M9.5 6l6 6-6 6"/>'
  };
  function iconSvg(name, size) {
    var px = size || 22;
    return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      (ICONS[name] || "") + '</svg>';
  }

  var DEVICE_KEY = "home-suite-device-key-v1"; // set by the setup link; shared by every Home Suite page
  var TODO_CACHE_KEY = "home-todos-cache-v1"; // the To-dos page keeps its last list here

  function store(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function pad2(n) { return ("0" + n).slice(-2); }
  function dayKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

  var now = new Date();
  document.getElementById("greeting").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("title").textContent = CONFIG.TITLE;
  document.title = CONFIG.TITLE;

  /* ---------- tiles ---------- */

  var summaries = {};
  var appsEl = document.getElementById("apps");
  CONFIG.APPS.forEach(function (app) {
    var li = document.createElement("li");
    li.className = "app " + (app.color || "");

    var open = document.createElement("a");
    open.className = "open";
    open.href = app.href;
    var icon = document.createElement("span");
    icon.className = "icon";
    icon.setAttribute("aria-hidden", "true");
    icon.innerHTML = iconSvg(app.icon, 32);
    var text = document.createElement("div");
    var name = document.createElement("h2");
    name.className = "name";
    name.textContent = app.name;
    var blurb = document.createElement("div");
    blurb.className = "blurb";
    blurb.textContent = app.blurb || "";
    text.appendChild(name); text.appendChild(blurb);
    var chev = document.createElement("span");
    chev.className = "chev";
    chev.setAttribute("aria-hidden", "true");
    chev.innerHTML = iconSvg("chevron", 20);
    open.appendChild(icon); open.appendChild(text); open.appendChild(chev);
    li.appendChild(open);

    var summary = document.createElement("div");
    summary.className = "summary";
    summary.hidden = true;
    li.appendChild(summary);
    summaries[app.id] = summary;

    if (app.actions && app.actions.length) {
      var actions = document.createElement("div");
      actions.className = "actions";
      app.actions.forEach(function (a) {
        var link = document.createElement("a");
        link.className = "action";
        link.href = a.href;
        link.textContent = a.label;
        actions.appendChild(link);
      });
      li.appendChild(actions);
    }
    appsEl.appendChild(li);
  });

  var soon = document.createElement("li");
  soon.className = "soon";
  soon.textContent = "More home apps will appear here.";
  appsEl.appendChild(soon);

  function fill(id, label, build) {
    var box = summaries[id];
    if (!box) return;
    box.textContent = "";
    var l = document.createElement("span");
    l.className = "label";
    l.textContent = label;
    box.appendChild(l);
    build(box);
    box.hidden = false;
  }

  /* ---------- live summaries ---------- */

  // To-dos: open items per list (last saved copy first, then fresh from Google).
  function showTodos(items) {
    var counts = {}, order = [];
    (items || []).forEach(function (it) {
      if (it.done) return;
      if (!counts[it.list]) { counts[it.list] = 0; order.push(it.list); }
      counts[it.list]++;
    });
    fill("todos", "Open", function (box) {
      if (!order.length) {
        var q = document.createElement("span");
        q.className = "quiet";
        q.textContent = "Nothing open. All done!";
        box.appendChild(q);
        return;
      }
      var stats = document.createElement("div");
      stats.className = "stats";
      order.forEach(function (list) {
        var s = document.createElement("span");
        s.className = "stat";
        var b = document.createElement("b");
        b.textContent = counts[list];
        s.appendChild(b);
        s.appendChild(document.createTextNode(list));
        stats.appendChild(s);
      });
      box.appendChild(stats);
    });
  }
  try { var cached = JSON.parse(store(TODO_CACHE_KEY) || "null"); if (cached) showTodos(cached); } catch (e) { /* ignore */ }
  var device = document.getElementById("device");
  function deviceNote(text, ok) {
    device.textContent = text;
    device.className = "device" + (ok ? " ok" : "");
    device.hidden = false;
  }
  if (store(DEVICE_KEY)) {
    if (window.__justSetUp) deviceNote("This device is set up. Home To-dos and the recipe tools will work here.", true);
    fetch(CONFIG.HELPER_URL, { method: "POST", body: JSON.stringify({ key: store(DEVICE_KEY), action: "todos" }) })
      .then(function (res) { return res.json(); })
      .then(function (out) {
        if (out && out.ok) showTodos(out.items);
        else if (out && out.needsSetup) {
          try { localStorage.removeItem(DEVICE_KEY); } catch (e) { /* ignore */ }
          deviceNote("This device's setup link is no longer valid. Open your current setup link once.");
        }
      })
      .catch(function () { /* the cached numbers stay */ });
  } else {
    deviceNote("This device isn't set up yet. Open your Home Suite setup link on it once.");
  }

  // Recipes: today's menu from the recipe sheet's Menu tab (read through the helper).
  if (CONFIG.HELPER_URL) {
    fetch(CONFIG.HELPER_URL + "?recipes=1&t=" + Date.now(), { cache: "no-store", credentials: "omit" })
      .then(function (res) { return res.ok ? res.json() : {}; })
      .then(function (out) { return out && out.ok ? out.menu : ""; })
      .then(function (text) {
        var rows = parseCSV(text);
        var head = (rows[0] || []).map(function (h) { return String(h).toLowerCase(); });
        var di = head.findIndex(function (h) { return /date|day/.test(h); });
        var ni = head.findIndex(function (h) { return /dish|name|item/.test(h); });
        var mi = head.findIndex(function (h) { return /meal|section|time/.test(h); });
        var today = dayKey(new Date());
        var meals = {}, order = [];
        if (di >= 0 && ni >= 0) {
          rows.slice(1).forEach(function (r) {
            if (planDate(r[di]) !== today || !String(r[ni] || "").trim()) return;
            var meal = mi >= 0 && String(r[mi] || "").trim() || "Menu";
            if (!meals[meal]) { meals[meal] = []; order.push(meal); }
            meals[meal].push(String(r[ni]).trim());
          });
        }
        fill("recipes", "Today's menu", function (box) {
          if (!order.length) {
            var q = document.createElement("span");
            q.className = "quiet";
            q.textContent = "Nothing planned for today yet.";
            box.appendChild(q);
            return;
          }
          order.forEach(function (meal) {
            var line = document.createElement("div");
            var b = document.createElement("b");
            b.textContent = meal + ": ";
            line.appendChild(b);
            line.appendChild(document.createTextNode(meals[meal].join(", ")));
            box.appendChild(line);
          });
        });
      })
      .catch(function () { /* no summary */ });
  }

  function planDate(raw) {
    var s = String(raw || "").trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    return m ? m[3] + "-" + pad2(m[2]) + "-" + pad2(m[1]) : "";
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    text = String(text || "").replace(/^﻿/, "");
    if (/^\s*<(!doctype|html)/i.test(text)) return [];
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
})();
</script>
<script>
(function () {
  "use strict";
    /* The cat in the title row: walk right, lick a paw, purr, walk back, nap, repeat. */
    (function catLife() {
      var lane = document.getElementById("catLane"), cat = document.getElementById("kitty");
      if (!lane || !cat) return;
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var x = 0, facing = 1;
      function state(name) { cat.setAttribute("class", "kitty " + name + (facing < 0 ? " flip" : "")); }
      function walkTo(target, then) {
        target = Math.max(0, Math.round(target));
        if (Math.abs(target - x) < 4) { then(); return; }
        facing = target > x ? 1 : -1;
        state("walk");
        var secs = Math.max(1.5, Math.abs(target - x) / 26);
        cat.style.transitionDuration = secs + "s";
        x = target;
        cat.style.transform = "translateX(" + x + "px)";
        setTimeout(then, secs * 1000);
      }
      function rest(name, secs, then) { state(name); setTimeout(then, secs * 1000); }
      function life() {
        walkTo(lane.clientWidth - 64, function () {
          rest("lick", 4, function () {
            rest("purr", 3, function () {
              walkTo(0, function () { rest("sleep", 9, life); });
            });
          });
        });
      }
      state("");
      setTimeout(life, 1500);
    })();
})();
</script>
