<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home To-dos">
<title>Home To-dos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F6B2A'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='%23FBF5EA' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<script>
/* ============================================================
   SETTINGS
   ============================================================ */
const CONFIG = {
  // The same helper web app the recipe page uses (voice-notes-helper.gs).
  HELPER_URL: "https://script.google.com/macros/s/AKfycbzKgqTVNnPieihSyylKKASbCG3afc_VKvxpC01BBxL57A8YLPGeYSRl2l5z2PExViO5/exec",

  // The built-in lists, in order (they cannot be deleted from the page).
  // type "check" is a checklist, type "note" is a free-text page.
  // More lists can be made on the page with the + button.
  LISTS: [
    { name: "Things to order", icon: "cart", type: "check", placeholder: "Add something to order" },
    { name: "Home chores",     icon: "sparkles", type: "check", placeholder: "Add a chore" },
    { name: "Notes",           icon: "note", type: "note" }
  ]
};
</script>

<style>
  /* Apple-style design tokens (Reminders blue). Dark follows the phone's setting. */
  :root {
    color-scheme: light dark;

    /* Palette (Apple's dark system colours). Every colour on the page comes from here.
       Ink #000000  Graphite #1C1C1E  Slate #2C2C2E  Snow #F5F5F7  Ash #98989D
       Saffron #FF9F0A  Sky #0A84FF  Sun #FFD60A  Leaf #30D158  Indigo #5E5CE6  Ember #FF453A */
    --ink-black: #000000;
    --graphite: #1C1C1E;
    --slate: #2C2C2E;
    --snow: #F5F5F7;
    --ash: #98989D;
    --saffron: #FF9F0A;
    --sky: #0A84FF;
    --sun: #FFD60A;
    --leaf: #30D158;
    --indigo: #5E5CE6;
    --ember: #FF453A;

    /* Roles */
    --bg: var(--ink-black);
    --card: var(--graphite);
    --raised: var(--slate);
    --ink: var(--snow);
    --muted: var(--ash);
    --line: rgba(84, 84, 88, 0.65);
    --fill: rgba(118, 118, 128, 0.24);
    --chrome: rgba(22, 22, 24, 0.72);
    --shadow: none;
    --line-strong: rgba(235, 235, 245, 0.45);
    --on-accent: #000000;   /* text on Saffron/Ember fills */
    --on-sky: #FFFFFF;      /* text on Sky fills, both modes */
    --accent: var(--sky);
    --accent-soft: rgba(10, 132, 255, 0.2);
    --danger: var(--ember);
    --radius: 16px;
    /* Same text-size scale as the recipe page */
    --fs-title: 2.125rem;
    --fs-heading: 1.375rem;
    --fs-body: 1.0625rem;
    --fs-small: 0.9375rem;
    --fs-label: 0.8125rem;
  }

  /* Light mode: the same palette in Apple's light (higher-contrast) values.
     The page follows the phone: light when it is light, dark when it is dark. */
  @media (prefers-color-scheme: light) {
    :root {
      --graphite: #FFFFFF;
      --slate: #FFFFFF;
      --snow: #1C1C1E;
      --ash: #6E6E73;
      --saffron: #C93400;
      --sky: #007AFF;
      --sun: #B25000;
      --leaf: #248A3D;
      --indigo: #3634A3;
      --ember: #D70015;

      --bg: #F2F2F7;
      --line: rgba(60, 60, 67, 0.16);
      --line-strong: rgba(60, 60, 67, 0.5);
      --fill: rgba(118, 118, 128, 0.12);
      --chrome: rgba(242, 242, 247, 0.78);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.06);
      --on-accent: #FFFFFF;
      --accent-soft: rgba(0, 122, 255, 0.12);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
                 "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif;
    line-height: 1.35; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; }
  [hidden] { display: none !important; }

  header { padding: 14px 0 6px; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  .home-link { color: var(--muted); font-size: var(--fs-small); font-weight: 600; text-decoration: none; }
  .sync { font-size: var(--fs-label); font-weight: 700; color: var(--muted); }
  .sync.error { color: var(--danger); }
  h1 { margin: 6px 0 0; font-size: var(--fs-title); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }

  /* List switcher */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 12px; border-bottom: 1px solid var(--line); }
  .lists { display: flex; flex-wrap: wrap; gap: 8px; }
  .list-tab {
    flex: 1 1 130px; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 54px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 14px;
    background: var(--card); color: var(--ink); font-size: var(--fs-body); font-weight: 700; line-height: 1.15; cursor: pointer;
  }
  .list-tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .list-tab .n {
    min-width: 26px; padding: 1px 7px; border-radius: 999px; font-size: var(--fs-label);
    background: var(--accent-soft); color: var(--accent);
  }
  .list-tab[aria-selected="true"] .n { background: rgba(245, 245, 247, 0.22); color: var(--on-sky); }

  .list-tab.plus {
    flex: 0 0 54px; padding: 0; border-style: dashed; color: var(--accent); border-color: var(--accent);
    font-size: 1.7rem; font-weight: 600; line-height: 1;
  }
  .list-tab.plus[aria-expanded="true"] { background: var(--accent-soft); }

  /* New list panel */
  .newlist { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  .newlist label { display: block; font-size: var(--fs-small); font-weight: 700; color: var(--muted); }
  .newlist input {
    display: block; width: 100%; margin-top: 6px; min-height: 52px; padding: 10px 14px;
    border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: var(--fs-body); color: var(--ink);
  }
  .newlist input:focus { outline: none; border-color: var(--accent); }
  .types { display: flex; gap: 8px; margin: 12px 0; }
  .type-chip {
    flex: 1 1 0; min-height: 52px; border: 2px solid var(--line); border-radius: 14px; background: var(--card);
    color: var(--ink); font-size: var(--fs-body); font-weight: 700; cursor: pointer;
  }
  .type-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .type-chip small { display: block; font-size: var(--fs-label); font-weight: 600; color: var(--muted); }
  .newlist .row { display: flex; gap: 8px; }
  .newlist .create, .newlist .cancel {
    flex: 1 1 0; min-height: 52px; border-radius: 14px; font-size: var(--fs-body); font-weight: 800; cursor: pointer;
  }
  .newlist .create { border: 0; background: var(--accent); color: var(--on-sky); }
  .newlist .cancel { border: 1.5px solid var(--line); background: var(--card); color: var(--muted); }
  .newlist .msg { margin: 10px 0 0; color: var(--danger); font-size: var(--fs-small); font-weight: 600; }

  /* Note page */
  .note textarea {
    display: block; width: 100%; min-height: 55vh; padding: 16px; resize: vertical;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink);
    font: inherit; font-size: var(--fs-body); line-height: 1.55;
  }
  .note textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .note-info { margin: 8px 4px 0; font-size: var(--fs-label); font-weight: 600; color: var(--muted); }

  .delete-list {
    display: block; margin: 28px auto 0; min-height: 44px; padding: 0 16px; border: 0; background: none;
    color: var(--danger); font-size: var(--fs-small); font-weight: 700; text-decoration: underline; cursor: pointer;
  }

  /* Add box */
  .add { display: flex; gap: 10px; margin-top: 12px; }
  .add input {
    flex: 1 1 auto; min-width: 0; min-height: 54px; padding: 10px 14px;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
    font: inherit; font-size: var(--fs-body);
  }
  .add input:focus { outline: none; border-color: var(--accent); }
  .add button {
    flex: none; min-width: 84px; min-height: 54px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--on-sky); font-size: var(--fs-body); font-weight: 800; cursor: pointer;
  }

  /* Items */
  main { padding: 14px 0 40px; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 4px 6px 4px 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  .tick {
    flex: 1 1 auto; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 4px 8px;
    border: 0; background: none; color: inherit; text-align: left; cursor: pointer; border-radius: 12px;
  }
  .box {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--ash);
    display: flex; align-items: center; justify-content: center; color: var(--on-sky); font-size: 1rem; font-weight: 900;
  }
  .text { font-size: var(--fs-body); overflow-wrap: anywhere; }
  .item.done .box { background: var(--accent); border-color: var(--accent); }
  .item.done .text { color: var(--muted); text-decoration: line-through; }
  .del {
    flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: none;
    color: var(--ash); font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .del:active { background: rgba(255, 69, 58, 0.16); color: var(--danger); }
  .tick:focus-visible, .del:focus-visible, .list-tab:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .empty {
    padding: 28px 20px; text-align: center; border: 2px dashed var(--line); border-radius: var(--radius);
    color: var(--muted); font-size: var(--fs-body);
  }
  .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: var(--fs-heading); }

  .done-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
  .done-toggle {
    border: 0; background: none; padding: 6px 0; color: var(--muted); font-size: var(--fs-small); font-weight: 800;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
  }
  .clear {
    border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 14px;
    color: var(--muted); font-size: var(--fs-small); font-weight: 700; cursor: pointer;
  }
  .share {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin-top: 16px;
    border: 2px solid var(--leaf); border-radius: 14px; background: var(--card); color: var(--leaf);
    font-size: var(--fs-body); font-weight: 800; text-decoration: none;
  }

  /* Passcode screen */
  .gate { margin-top: 24px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .gate h2 { margin: 0 0 4px; font-size: var(--fs-heading); }
  .gate p { margin: 0 0 14px; color: var(--muted); }
  .gate input {
    display: block; width: 100%; min-height: 54px; padding: 10px 14px; margin-bottom: 12px;
    border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: var(--fs-body);
  }
  .gate button {
    width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-sky);
    font-size: var(--fs-body); font-weight: 800; cursor: pointer;
  }
  .gate .msg { margin: 12px 0 0; color: var(--danger); font-weight: 600; }

  /* ============ Apple-style layer ============ */
  .list-tab .ico, .list-tab svg, .del svg, .box svg { display: block; flex: none; }
  .type-chip svg { vertical-align: -5px; margin-right: 4px; }
  h1 { letter-spacing: -0.022em; }
  .home-link, .sync { font-weight: 500; }
  .home-link { color: var(--accent); font-size: var(--fs-body); }

  /* Frosted bar: lists scroll underneath */
  .bar {
    background: var(--chrome);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0; box-shadow: 0 0.5px 0 var(--line);
  }
  .list-tab {
    min-height: 48px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font-weight: 600;
  }
  .list-tab[aria-selected="true"] { background: var(--accent); color: var(--on-sky); }
  .list-tab .n { background: var(--card); color: var(--muted); font-weight: 600; }
  .list-tab[aria-selected="true"] .n { background: rgba(245, 245, 247, 0.25); color: var(--on-sky); }
  .list-tab.plus { border: 1.5px dashed var(--line); background: transparent; color: var(--accent); font-weight: 400; }
  .list-tab.plus[aria-expanded="true"] { background: var(--accent-soft); border-color: transparent; }

  .add input, .newlist input { border: 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 0.5px var(--line); }
  .newlist input { background: var(--fill); box-shadow: none; }
  .add input:focus, .newlist input:focus { box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 1.5px var(--accent); }
  .add button, .newlist .create, .gate button { border-radius: 12px; background: var(--accent); font-weight: 600; }
  .newlist { border: 0; box-shadow: var(--shadow); }
  .newlist .cancel { border: 0; background: var(--fill); color: var(--ink); font-weight: 600; }
  .type-chip { border: 0; background: var(--fill); font-weight: 600; }
  .type-chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* One grouped card with hairline dividers, like Reminders */
  .items { gap: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .items:empty { display: none; }
  .item { border: 0; border-radius: 0; min-height: 52px; padding: 2px 4px 2px 6px; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 0.5px; background: var(--line); }
  .box { width: 24px; height: 24px; border: 1.5px solid var(--ash); font-size: 0.85rem; }
  .item.done .box { background: var(--accent); border-color: var(--accent); }
  .item.done .text { color: var(--muted); }
  .del { color: var(--muted); opacity: 0.6; }
  .del:active { background: rgba(255, 69, 58, 0.16); color: var(--danger); opacity: 1; }

  .empty { border: 0; background: var(--card); box-shadow: var(--shadow); }
  .done-toggle { font-weight: 600; letter-spacing: 0.04em; }
  .clear { border: 0; background: var(--fill); color: var(--accent); font-weight: 600; }
  .share { border: 0; border-radius: 12px; background: rgba(48, 209, 88, 0.16); color: var(--leaf); font-weight: 600; }
  .note textarea { border: 0; box-shadow: var(--shadow); }
  .note textarea:focus { box-shadow: 0 0 0 3px var(--accent-soft); }
  .gate { border: 0; box-shadow: var(--shadow); }
  .gate input { border: 0; background: var(--fill); border-radius: 12px; }

  /* Instant feedback on press */
  .list-tab, .add button, .tick, .clear, .share, .type-chip, .newlist .create, .newlist .cancel { transition: transform 100ms ease-out, background-color 150ms ease; }
  .list-tab:active, .add button:active, .clear:active, .share:active, .type-chip:active, .newlist .create:active, .newlist .cancel:active { transform: scale(0.97); }
  .tick:active { background: var(--fill); }
  @media (prefers-reduced-motion: reduce) {
    .list-tab, .add button, .tick, .clear, .share, .type-chip, .newlist .create, .newlist .cancel { transition: none; }
    .list-tab:active, .add button:active, .clear:active, .share:active, .type-chip:active, .newlist .create:active, .newlist .cancel:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    .items, .empty, .newlist, .note textarea, .gate { box-shadow: none; outline: 1px solid var(--line-strong); }
  }

  /* Small labels in sentence case, not tracked-out capitals */
  .eyebrow, .summary .label, .done-toggle {
    text-transform: none; letter-spacing: 0; font-size: var(--fs-small); font-weight: 600;
  }
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="topline">
      <a class="home-link" href="../home/">&larr; Home</a>
      <span class="sync" id="sync" aria-live="polite"></span>
    </div>
    <h1>Home To-dos</h1>
  </header>
</div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="lists" id="lists" role="tablist"></div>
    <form class="newlist" id="newList" autocomplete="off" hidden>
      <label for="newListName">New list name</label>
      <input id="newListName" type="text" maxlength="40" placeholder="For example: Pharmacy, Guests, Ideas">
      <div class="types" role="group" aria-label="Kind of list">
        <button class="type-chip" type="button" data-type="check" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5h10M10 12h10M10 17.5h10M4 6.5l1.2 1.2L7.5 5.4M4 12l1.2 1.2L7.5 10.9M4 17.5l1.2 1.2 2.3-2.3"/></svg> Checklist<small>Tick items off</small></button>
        <button class="type-chip" type="button" data-type="note" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/></svg> Note<small>Free writing</small></button>
      </div>
      <div class="row">
        <button class="create" type="submit">Create</button>
        <button class="cancel" type="button" id="newListCancel">Cancel</button>
      </div>
      <p class="msg" id="newListMsg" hidden></p>
    </form>
    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" type="text" enterkeyhint="done" maxlength="200">
      <button type="submit">Add</button>
    </form>
  </div>
</div>

<div class="wrap">
  <section class="gate" id="gate" hidden>
    <h2>Enter the passcode</h2>
    <p>The same passcode as the recipe tools. This phone remembers it.</p>
    <form id="gateForm">
      <input id="gatePass" type="password" autocomplete="current-password">
      <button type="submit" id="gateBtn">Open</button>
    </form>
    <p class="msg" id="gateMsg" hidden></p>
  </section>

  <main id="main" hidden>
    <section class="note" id="noteBox" hidden>
      <textarea id="noteText" placeholder="Write anything here. It saves by itself."></textarea>
      <p class="note-info" id="noteInfo"></p>
    </section>
    <ul class="items" id="pending"></ul>
    <div id="emptyBox"></div>
    <a class="share" id="share" target="_blank" rel="noopener noreferrer" hidden>Share this list on WhatsApp</a>
    <div class="done-head" id="doneHead" hidden>
      <button class="done-toggle" id="doneToggle" type="button"></button>
      <button class="clear" id="clearDone" type="button">Clear done</button>
    </div>
    <ul class="items" id="doneList" hidden></ul>
    <button class="delete-list" id="deleteList" type="button" hidden></button>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* Line icons in the SF Symbols style: one stroke weight, drawn in the text colour.
     Only these fixed shapes are ever inserted as markup. */
  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
    bowl: '<path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8c0-1.2 1-1.6 1-2.8M12 8c0-1.2 1-1.6 1-2.8M15.5 8c0-1.2 1-1.6 1-2.8"/>',
    moon: '<path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6z"/>',
    fork: '<path d="M7 3v7.5M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10.5V21M17.5 21V3c-2 1-3.5 3.6-3.5 6.5 0 2.2 1.2 3.5 3.5 3.5"/>',
    speaker: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11"/>',
    loading: '<path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
    cart: '<path d="M3 4h2.2l2.3 10.5h10.3L20.5 7.5H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
    sparkles: '<path d="M11 3.5l1.6 4.4 4.4 1.6-4.4 1.6L11 15.5l-1.6-4.4L5 9.5l4.4-1.6zM18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
    note: '<path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/>',
    list: '<path d="M10 6.5h10M10 12h10M10 17.5h10M4 6.5l1.2 1.2L7.5 5.4M4 12l1.2 1.2L7.5 10.9M4 17.5l1.2 1.2 2.3-2.3"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    xmark: '<path d="M7 7l10 10M17 7L7 17"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chevron: '<path d="M9.5 6l6 6-6 6"/>'
  };
  function iconSvg(name, size) {
    var px = size || 22;
    return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      (ICONS[name] || "") + '</svg>';
  }

  var PASS_KEY = "recipe-page-passcode-v1";   // shared with the recipe tools and Home
  var CACHE_KEY = "home-todos-cache-v1";        // the items (Home reads this too)
  var LISTS_CACHE_KEY = "home-todos-lists-v1";  // lists made with + and note text
  var LIST_KEY = "home-todos-list-v1";

  var el = {
    sync: document.getElementById("sync"),
    bar: document.getElementById("bar"),
    lists: document.getElementById("lists"),
    addForm: document.getElementById("addForm"),
    addInput: document.getElementById("addInput"),
    gate: document.getElementById("gate"),
    gateForm: document.getElementById("gateForm"),
    gatePass: document.getElementById("gatePass"),
    gateBtn: document.getElementById("gateBtn"),
    gateMsg: document.getElementById("gateMsg"),
    main: document.getElementById("main"),
    pending: document.getElementById("pending"),
    emptyBox: document.getElementById("emptyBox"),
    share: document.getElementById("share"),
    doneHead: document.getElementById("doneHead"),
    doneToggle: document.getElementById("doneToggle"),
    clearDone: document.getElementById("clearDone"),
    doneList: document.getElementById("doneList"),
    newList: document.getElementById("newList"),
    newListName: document.getElementById("newListName"),
    newListCancel: document.getElementById("newListCancel"),
    newListMsg: document.getElementById("newListMsg"),
    noteBox: document.getElementById("noteBox"),
    noteText: document.getElementById("noteText"),
    noteInfo: document.getElementById("noteInfo"),
    deleteList: document.getElementById("deleteList")
  };

  var items = [];          // [{ id, list, task, done, added, doneAt }]
  var currentList = null;
  var showDone = false;
  var queue = Promise.resolve();
  var inFlight = 0;
  var lastLoad = 0;
  var serverLists = [];    // [{ name, type, icon, text, updated }] from the Lists tab
  var notes = {};          // note text by list name, as typed here
  var noteDirty = {};      // typed here but not yet sent
  var noteTimer = null;
  var newListType = "check";

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) { /* private mode or blocked storage: carry on without it */ }
    return null;
  }

  function setSync(text, isError) {
    el.sync.textContent = text || "";
    el.sync.classList.toggle("error", !!isError);
  }

  function listNames() {
    var names = CONFIG.LISTS.map(function (l) { return l.name; });
    serverLists.forEach(function (l) { if (names.indexOf(l.name) < 0) names.push(l.name); });
    items.forEach(function (it) { if (it.list && names.indexOf(it.list) < 0) names.push(it.list); });
    return names;
  }
  function isBuiltIn(name) {
    return CONFIG.LISTS.some(function (l) { return l.name === name; });
  }
  function listInfo(name) {
    var built = CONFIG.LISTS.filter(function (l) { return l.name === name; })[0];
    var made = serverLists.filter(function (l) { return l.name === name; })[0];
    var type = (built && built.type) || (made && made.type) || "check";
    return {
      name: name,
      type: type === "note" ? "note" : "check",
      // Lists made earlier may carry an emoji; anything that is not a known icon falls back by type.
      icon: [built && built.icon, made && made.icon].filter(function (n) { return n && ICONS[n]; })[0] ||
            (type === "note" ? "note" : "list"),
      placeholder: (built && built.placeholder) || "Add to " + name
    };
  }

  /* ---------- talking to the helper ---------- */

  function call(body) {
    body.passcode = store(PASS_KEY) || "";
    return fetch(CONFIG.HELPER_URL, { method: "POST", body: JSON.stringify(body) })
      .then(function (res) { return res.json(); })
      .then(function (out) {
        if (!out || !out.ok) {
          var err = new Error((out && out.error) || "Could not save.");
          err.wrongPass = /passcode/i.test(err.message);
          throw err;
        }
        return out;
      });
  }

  // Changes go one at a time, in order. The screen changes straight away; the
  // answer from Google (the whole list) is only shown once nothing else is waiting.
  function send(body) {
    inFlight++;
    setSync("Saving...");
    queue = queue.then(function () { return call(body); }).then(function (out) {
      inFlight--;
      if (!inFlight) { setData(out); setSync("Saved"); }
    }, function (err) {
      inFlight--;
      if (err.wrongPass) { lock(err.message); return; }
      setSync("Not saved. Check the internet.", true);
      if (!inFlight) refresh();
    });
  }

  function refresh() {
    lastLoad = Date.now();
    if (!inFlight) setSync("Updating...");
    return call({ action: "todos" }).then(function (out) {
      if (!inFlight) { setData(out); setSync(""); }
      return true;
    }).catch(function (err) {
      if (err.wrongPass) { lock(err.message); return false; }
      setSync(items.length ? "Offline. Showing the last saved list." : "Could not load. Check the internet.", true);
      return false;
    });
  }

  function setData(out) {
    items = out.items || [];
    if (out.lists) {
      serverLists = out.lists;
      // A note being typed here keeps what is on screen; the rest take Google's copy.
      serverLists.forEach(function (l) { if (l.type === "note" && !noteDirty[l.name]) notes[l.name] = l.text; });
    }
    saveCache();
    render();
  }

  function saveCache() {
    store(CACHE_KEY, JSON.stringify(items));
    store(LISTS_CACHE_KEY, JSON.stringify({ lists: serverLists, notes: notes }));
  }

  /* ---------- drawing ---------- */

  function render() {
    var names = listNames();
    if (names.indexOf(currentList) < 0) currentList = names[0];

    el.lists.textContent = "";
    names.forEach(function (name) {
      var info = listInfo(name);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "list-tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", name === currentList ? "true" : "false");
      var icon = document.createElement("span");
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = iconSvg(info.icon, 22);
      icon.className = "ico";
      var label = document.createElement("span");
      label.textContent = name;
      b.appendChild(icon); b.appendChild(label);
      if (info.type === "check") {
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = items.filter(function (it) { return it.list === name && !it.done; }).length;
        b.appendChild(n);
      }
      b.addEventListener("click", function () {
        flushNote();
        currentList = name;
        store(LIST_KEY, name);
        closeNewList();
        render();
      });
      el.lists.appendChild(b);
    });

    // The + button makes a new list.
    var plus = document.createElement("button");
    plus.type = "button";
    plus.className = "list-tab plus";
    plus.setAttribute("aria-label", "Make a new list");
    plus.setAttribute("aria-expanded", el.newList.hidden ? "false" : "true");
    plus.innerHTML = iconSvg("plus", 24);
    plus.addEventListener("click", function () {
      if (el.newList.hidden) openNewList(); else closeNewList();
    });
    el.lists.appendChild(plus);

    var current = listInfo(currentList);
    el.deleteList.hidden = isBuiltIn(currentList);
    el.deleteList.textContent = "Delete the list \u201C" + currentList + "\u201D";

    // A note page: one big text box instead of a checklist.
    var isNote = current.type === "note";
    el.addForm.hidden = isNote;
    el.noteBox.hidden = !isNote;
    el.pending.hidden = isNote;
    el.emptyBox.hidden = isNote;
    if (isNote) {
      el.doneHead.hidden = true;
      el.doneList.hidden = true;
      var text = notes[currentList] || "";
      if (el.noteText.dataset.list !== currentList || (document.activeElement !== el.noteText && !noteDirty[currentList])) {
        el.noteText.value = text;
        el.noteText.dataset.list = currentList;
      }
      showNoteInfo();
      el.share.hidden = !text.trim();
      if (text.trim()) el.share.href = "https://wa.me/?text=" + encodeURIComponent(currentList + ":\n" + text.trim());
      el.share.textContent = "Share this note on WhatsApp";
      return;
    }
    el.share.textContent = "Share this list on WhatsApp";
    el.addInput.placeholder = current.placeholder;

    var mine = items.filter(function (it) { return it.list === currentList; });
    var open = mine.filter(function (it) { return !it.done; })
      .sort(function (a, b) { return (b.added || 0) - (a.added || 0); });
    var done = mine.filter(function (it) { return it.done; })
      .sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    el.pending.textContent = "";
    open.forEach(function (it) { el.pending.appendChild(row(it)); });

    el.emptyBox.textContent = "";
    if (!open.length) {
      var e = document.createElement("div");
      e.className = "empty";
      var strong = document.createElement("strong");
      strong.textContent = done.length ? "All done" : "Nothing here yet";
      e.appendChild(strong);
      e.appendChild(document.createTextNode("Type in the box above and tap Add."));
      el.emptyBox.appendChild(e);
    }

    // Send the open items to someone (for example the shop) in one message.
    el.share.hidden = !open.length;
    if (open.length) {
      var text = listInfo(currentList).name + ":\n" + open.map(function (it) { return "• " + it.task; }).join("\n");
      el.share.href = "https://wa.me/?text=" + encodeURIComponent(text);
    }

    el.doneHead.hidden = !done.length;
    el.doneToggle.textContent = (showDone ? "▾ " : "▸ ") + "Done (" + done.length + ")";
    el.doneList.hidden = !showDone || !done.length;
    el.doneList.textContent = "";
    done.forEach(function (it) { el.doneList.appendChild(row(it)); });
  }

  function row(it) {
    var li = document.createElement("li");
    li.className = "item" + (it.done ? " done" : "");
    var tick = document.createElement("button");
    tick.type = "button";
    tick.className = "tick";
    tick.setAttribute("aria-pressed", it.done ? "true" : "false");
    var box = document.createElement("span");
    box.className = "box";
    box.setAttribute("aria-hidden", "true");
    box.innerHTML = it.done ? iconSvg("check", 16) : "";
    var text = document.createElement("span");
    text.className = "text";
    text.textContent = it.task;
    tick.appendChild(box); tick.appendChild(text);
    tick.addEventListener("click", function () {
      it.done = !it.done;
      it.doneAt = it.done ? Date.now() : 0;
      saveCache();
      render();
      send({ action: "todoSet", id: it.id, done: it.done });
    });
    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.setAttribute("aria-label", "Delete " + it.task);
    del.innerHTML = iconSvg("xmark", 20);
    del.addEventListener("click", function () {
      items = items.filter(function (x) { return x !== it; });
      saveCache();
      render();
      send({ action: "todoDelete", id: it.id });
    });
    li.appendChild(tick); li.appendChild(del);
    return li;
  }

  /* ---------- notes ---------- */

  function showNoteInfo() {
    var made = serverLists.filter(function (l) { return l.name === currentList; })[0];
    if (noteDirty[currentList]) el.noteInfo.textContent = "Saving as you type...";
    else if (made && made.updated) {
      el.noteInfo.textContent = "Saved \u00B7 last changed " + new Date(made.updated)
        .toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    } else el.noteInfo.textContent = "";
  }

  // Sends the note a moment after typing stops, or straight away when leaving it.
  function flushNote() {
    if (!noteTimer) return;
    clearTimeout(noteTimer);
    noteTimer = null;
    var name = el.noteText.dataset.list;
    if (!name || !noteDirty[name]) return;
    noteDirty[name] = false;
    send({ action: "todoNoteSave", name: name, text: notes[name] || "", icon: listInfo(name).icon });
  }

  el.noteText.addEventListener("input", function () {
    var name = el.noteText.dataset.list || currentList;
    notes[name] = el.noteText.value;
    noteDirty[name] = true;
    saveCache();
    showNoteInfo();
    var text = el.noteText.value.trim();
    el.share.hidden = !text;
    if (text) el.share.href = "https://wa.me/?text=" + encodeURIComponent(name + ":\n" + text);
    clearTimeout(noteTimer);
    noteTimer = setTimeout(flushNote, 1200);
  });
  el.noteText.addEventListener("blur", flushNote);

  /* ---------- new lists ---------- */

  function openNewList() {
    el.newList.hidden = false;
    el.newListMsg.hidden = true;
    el.newListName.value = "";
    setType("check");
    render();
    el.newListName.focus();
  }
  function closeNewList() {
    if (el.newList.hidden) return;
    el.newList.hidden = true;
    render();
  }
  function setType(type) {
    newListType = type;
    Array.prototype.forEach.call(el.newList.querySelectorAll(".type-chip"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.type === type ? "true" : "false");
    });
  }

  el.newList.addEventListener("click", function (e) {
    var chip = e.target.closest(".type-chip");
    if (chip) setType(chip.dataset.type);
  });
  el.newListCancel.addEventListener("click", closeNewList);
  el.newList.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = el.newListName.value.trim().replace(/\s+/g, " ");
    var clash = listNames().filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
    if (!name) { el.newListMsg.textContent = "Type a name for the list."; el.newListMsg.hidden = false; return; }
    if (clash) { el.newListMsg.textContent = "There is already a list called " + clash + "."; el.newListMsg.hidden = false; return; }
    var icon = newListType === "note" ? "note" : "list";
    serverLists.push({ name: name, type: newListType, icon: icon, text: "", updated: 0 });
    flushNote();
    currentList = name;
    store(LIST_KEY, name);
    el.newList.hidden = true;
    saveCache();
    render();
    send({ action: "todoListAdd", name: name, type: newListType, icon: icon });
    if (newListType === "note") el.noteText.focus(); else el.addInput.focus();
  });

  el.deleteList.addEventListener("click", function () {
    var name = currentList;
    if (isBuiltIn(name)) return;
    var count = items.filter(function (it) { return it.list === name; }).length;
    var what = listInfo(name).type === "note" ? "the note" : (count ? count + (count === 1 ? " item" : " items") : "nothing yet");
    if (!window.confirm("Delete \u201C" + name + "\u201D? It holds " + what + ". This cannot be undone.")) return;
    serverLists = serverLists.filter(function (l) { return l.name !== name; });
    items = items.filter(function (it) { return it.list !== name; });
    delete notes[name];
    delete noteDirty[name];
    currentList = CONFIG.LISTS[0].name;
    store(LIST_KEY, currentList);
    saveCache();
    render();
    send({ action: "todoListDelete", name: name });
  });

  /* ---------- passcode ---------- */

  function lock(message) {
    store(PASS_KEY, null);
    el.bar.hidden = true;
    el.main.hidden = true;
    el.gate.hidden = false;
    el.gateMsg.textContent = message || "";
    el.gateMsg.hidden = !message;
    setSync("");
    el.gatePass.focus();
  }

  function unlock() {
    el.gate.hidden = true;
    el.bar.hidden = false;
    el.main.hidden = false;
    render();
  }

  el.gateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = el.gatePass.value.trim();
    if (!pass) return;
    store(PASS_KEY, pass);
    el.gateBtn.disabled = true;
    el.gateBtn.textContent = "Checking...";
    el.gateMsg.hidden = true;
    refresh().then(function (ok) {
      el.gateBtn.disabled = false;
      el.gateBtn.textContent = "Open";
      if (ok) unlock();
      else if (!el.gate.hidden && el.gateMsg.hidden) {
        el.gateMsg.textContent = "Could not reach Google. Check the internet and try again.";
        el.gateMsg.hidden = false;
      }
    });
  });

  /* ---------- adding, clearing ---------- */

  el.addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var task = el.addInput.value.trim();
    if (!task) { el.addInput.focus(); return; }
    var it = {
      id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      list: currentList, task: task, done: false, added: Date.now(), doneAt: 0
    };
    items.push(it);
    el.addInput.value = "";
    el.addInput.focus();
    saveCache();
    render();
    send({ action: "todoAdd", id: it.id, list: it.list, task: it.task });
  });

  el.doneToggle.addEventListener("click", function () { showDone = !showDone; render(); });
  el.clearDone.addEventListener("click", function () {
    var list = currentList;
    items = items.filter(function (it) { return !(it.list === list && it.done); });
    saveCache();
    render();
    send({ action: "todoClearDone", list: list });
  });

  // Coming back to the page picks up changes made on another phone.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { flushNote(); return; }
    if (!el.main.hidden && !inFlight && Date.now() - lastLoad > 30000) refresh();
  });

  /* ---------- start ---------- */

  try { items = JSON.parse(store(CACHE_KEY) || "[]") || []; } catch (e) { items = []; }
  try {
    var savedLists = JSON.parse(store(LISTS_CACHE_KEY) || "null");
    if (savedLists) { serverLists = savedLists.lists || []; notes = savedLists.notes || {}; }
  } catch (e) { /* start without them */ }
  currentList = store(LIST_KEY);

  if (!store(PASS_KEY)) {
    lock("");
  } else {
    unlock();
    refresh();
  }
})();
</script>
</body>
</html>
